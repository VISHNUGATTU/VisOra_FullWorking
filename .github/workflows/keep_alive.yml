name: VisOra 24/7 Cloud Keep-Alive Cron

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier spin-down
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Node.js Backend Server
        run: |
          SERVER_URL="${{ secrets.RENDER_SERVER_URL }}"
          if [ -z "$SERVER_URL" ]; then
            SERVER_URL="https://visora-server-w426.onrender.com"
          fi
          echo "Pinging Node.js Server: $SERVER_URL/health"
          curl -s -f -m 20 "$SERVER_URL/health" || echo "Server ping failed or waking up"

      - name: Ping Python Neural AI Engine
        run: |
          ENGINE_URL="${{ secrets.RENDER_ENGINE_URL }}"
          if [ -z "$ENGINE_URL" ]; then
            ENGINE_URL="https://visora-engine.onrender.com"
          fi
          echo "Pinging Neural Engine: $ENGINE_URL/health"
          curl -s -f -m 25 "$ENGINE_URL/health" || echo "Engine ping failed or waking up"
